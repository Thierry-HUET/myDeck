<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myDeck — Présentations en Markdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage">
    <section id="slide" class="slide"></section>
  </main>

  <div id="progress"></div>

  <nav id="hud">
    <button id="btn-prev" title="Slide précédente (←)">←</button>
    <span id="counter">– / –</span>
    <button id="btn-next" title="Slide suivante (→)">→</button>
    <button id="btn-full" title="Plein écran (F)">⛶</button>
    <button id="btn-overview" title="Vue d'ensemble (O)">▦</button>
  </nav>

  <section id="overview" class="hidden"></section>

  <!-- Rendu Markdown via marked (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
